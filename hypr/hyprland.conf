################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,highress,auto,auto,bitdepth, 10 


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
# $terminal = kitty
# $terminal = alacritty
$terminal = wezterm
$fileManager = nemo
# $menu = wofi --show drun
$browser = zen-twilight
#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar & hyprpaper & fcitx5 
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
# env = XCURSOR_THEME,"Future-Cyan-Hyprcursor_Theme"
env = XCURSOR_SIZE,24
# exec-once = gsettings set org.gnome.desktop.interface cursor-theme Future-Cyan-Hyprcursor_Theme
# exec-once = gsettings set org.gnome.desktop.interface cursor-size 28
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,"Future-Cyan-Hyprcursor_Theme"
# env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# # env = QT_STYLE_OVERRIDE,kvantum
# # env = GDK_SCALE,2
# env = QT_QPA_PLATFORM,wayland
# Input Methods
env = XMODIFIERS, @im=fcitx
# This line is removed since it causes GTK applications crash (if without Wayland support)
# env = GTK_IM_MODULE, wayland
# env = QT_IM_MODULE, wayland
env = SDL_IM_MODULE, fcitx

# SDL wayland
# This is deprecated since many clients does not support wayland
# env = SDL_VIDEODRIVER, "wayland,x11"

# ############################
# ## Environment variables ##
# ###########################

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,q6ct
env = QT_SCALE_FACTOR,2
env = GDK_SCALE,1
env = MOZ_ENABLE_WAYLAND,1
env = WAYLAND_DISPLAY=wayland-0
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 3

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(8F8BE9aa) rgba(FEEA0Daa) 180deg
    col.inactive_border = rgba(D9D955aa)
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 180deg
    # col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true 
    layout = dwindle
    # layout = master
}

cursor {
    inactive_timeout = 3 # hide after 3 seconds
}
# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 9

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.87

    shadow {
        enabled = true
        range = 4
        render_power = 2
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 2
        passes = 2
        contrast = 1.2
        # noise=
        vibrancy = 0.1696
    }
}
# windowrulev2 = opacity 0.94 0.94,class:^(Code|Slack|WebCord|Spotify)$
# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    # bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    #
    # animation = windowsMove, 1, 7, myBezier
    # animation = windowsIn, 1, 3, default, popin 90%
    # animation = windowsOut, 1, 2, default, popin 95%
    # animation = border, 1, 3, default
    # animation = fade, 1, 3, default
    # animation = workspaces, 1, 5, default

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    vfr = true
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

  touchpad {
    disable_while_typing = true
  # 开启自然滚动
    natural_scroll = true
  # 滚动幅度的设置为 0.2
    scroll_factor = 0.2
    clickfinger_behavior = false
    middle_button_emulation = true
    tap-to-click = true
    drag_lock = false
  }

}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }
gestures {
  workspace_swipe = true
  # 将触摸板手势改为 4 指
  workspace_swipe_fingers = 4
  # 触摸板手势的距离
  workspace_swipe_distance = 400
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 30
  # 更改滑动灵敏度
  workspace_swipe_cancel_ratio = 0.1
  workspace_swipe_create_new = true
  # 关掉连续工作区滚动，防止滑多了
  workspace_swipe_forever = false
  #workspace_swipe_use_r = true #uncomment if wanted a forever create a new workspace with swipe right
}
# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, L, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, Z, exec, $browser
bind = Super, Slash, exec, for ((i=0; i<$(hyprctl monitors -j | jq length); i++)); do agsv1 -t "cheatsheet""$i"; done # Show cheatsheet
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
# bind = $mainMod SHIFT, 7, movetoworkspace, 7
# bind = $mainMod SHIFT, 8, movetoworkspace, 8
# bind = $mainMod SHIFT, 9, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# 增大当前窗口宽度 (例如 SUPER + Ctrl + Right)
bind = SUPER CTRL ALT, right, resizeactive, 10 0  # 增大宽度 10 像素，高度不变 (0)
bind = SUPER CTRL ALT, left, resizeactive, -10 0 # 减小宽度 10 像素，高度不变 (0)
bind = SUPER CTRL, right, resizeactive, 50 0  # 增大宽度 10 像素，高度不变 (0)
bind = SUPER CTRL, left, resizeactive, -50 0 # 减小宽度 10 像素，高度不变 (0)

bind = SUPER CTRL ALT,up, resizeactive, 0 10  # 增大宽度 10 像素，高度不变 (0)
bind = SUPER CTRL ALT,down, resizeactive, 0 -10  # 减小宽度 10 像素，高度不变 (0)
bind = SUPER CTRL, up, resizeactive, 0 50   # 增大宽度 10 像素，高度不变 (0)
bind = SUPER CTRL, down, resizeactive, 0-50  # 减小宽度 10 像素，高度不变 (0)

# Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
#
############################################################### SSound
bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume --inc
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume --dec
bind = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/volume --toggle-mic
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume --toggle

############################################################### Light
bind = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness --inc 
bind = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness --dec



# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


#############################################
bind = $mainMod, R, exec, tofi-drun | xargs hyprctl dispatch exec --    # 打开 tofi 应用启动器


# Hyprland some reload exec-once
bind = $mainMod CTRL ALT, R, exec, killall waybar; waybar
# bind = $mainMod CTRL ALT, R, exec, killall fcixt5; fcitx5

# Screenshot

## 使用 grim 来截取一个区域的图片并且放到剪贴板，不会把 fcitx5 的候选框窗口截进去
bind = CTRL, F1, exec, grim -g "$(slurp -d)" - | wl-copy
## 使用 hyprshot 来截取一个显示器的图片并且放到剪贴板，不会把 fcitx5 的候选框窗口截进去
bind = CTRL, F2, exec, hyprshot -m output | wl-copy
## 使用 grim 来截取所有显示器的图片并且放到剪贴板，会把 fcitx5 的候选框窗口截进去
bind = CTRL, F3, exec, grim - | wl-copy
bind = $mainMod, A, exec,  hyprpicker  -a 
# bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
# bind = $mainMod SHIFT, W, exec, grim -g "$(hyprctl -j active/indow | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy
# bind = ,print , exec, grim - | wl-copy
#
bind = CTRL SUPER, L, exec, hyprlock
bind = CTRL SUPER , X, exec, wlogout


#############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$
# windowrule = nofocus, ^(Ibus-ui-gtk3)$
# windowrule = nofocus, ^(Ibus-ui-gtk5)$
# windowrule = nofocus, ^(Ibus-ui-gtk4)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float,class:^(org.fcitx.fcitx5-config-qt)$,title:^(Fcitx Configuration)$
# windowrulev2 = float,class:^(mihomo-party)$,title:^(Mihomo Party)$
windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$,title:^(Volume Control)$
# windowrulev2 = float,class:^(yesplaymusic)$,title:^(YesPlayMusic)$
# windowrulev2 = float, title:^(?i).*YesPlayMusic.*$
### music
windowrulev2 = float, class:yesplaymusic
windowrulev2 = size 50% 60%, class:yesplaymusic

windowrulev2 = float, class:spotify
windowrulev2 = size 70% 75%, class:spotify
### music

windowrulev2 = float, title:^(?i)Save File$
windowrulev2 = float, title:^(?i)Save Image$
windowrulev2 = float, title:^(?i)Open Folder$
windowrulev2 = float, title:^(?i)Open files$
windowrulev2 = float, title:^(?i)Open file$

windowrulev2 = float, class:mpv
windowrulev2 = size 50% 60%, class:mpv

windowrulev2 = float, class:mpv
windowrulev2 = size 50% 60%, class:mpv
windowrulev2 =float, class:oculante
windowrulev2 = size 70% 60%, class:oculante

windowrulev2 =float, title:预览
# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:2,floating:1,fullscreen:0,pinned:0
windowrulev2 = float,class:^(org.wezfurlong.wezterm)$
windowrulev2 = tile,class:^(org.wezfurlong.wezterm)$

windowrulev2=size 50% 70%,class:^(GTK Application)$
windowrulev2=center,class:^(GTK Application)$
windowrulev2 = bordercolor rgb(FF0000) rgb(880808),fullscreen:1
# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 1, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 1, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# Blur and ignore rules
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = blur, launcher
layerrule = ignorezero, launcher
layerrule = blur, waybar # Add blur to waybar
layerrule = blurpopups, waybar # Blur waybar popups too!
layerrule = ignorealpha 0.2, waybar # Make it so transparent parts are ignored

# exec-once = "echo \"Xft.dpi: 100\" | xrdb -merge" 改成你的刷新率 我是144
 # "QT_AUTO_SCREEN_SCALE_FACTOR, 1"
 # "GDK_SCALE, 1"

